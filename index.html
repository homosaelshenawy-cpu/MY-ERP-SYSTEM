<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Odoo v19 Enterprise | Saudi Arabia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --o-v19-purple: #714B67;
            --o-v19-teal: #00A09D;
            --o-v19-bg: #f8f9fa;
            --o-v19-text: #111827;
            --o-v19-border: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; background-color: var(--o-v19-bg); color: var(--o-v19-text);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* Top Navbar */
        .o_navbar {
            background-color: var(--o-v19-purple); color: white; height: 50px;
            display: flex; align-items: center; padding: 0 20px; z-index: 1000;
        }
        .o_menu_brand { font-weight: 600; font-size: 19px; margin-left: 25px; }
        .o_nav_link { padding: 0 15px; cursor: pointer; height: 100%; display: flex; align-items: center; font-size: 14px; opacity: 0.85; }
        .o_nav_link:hover { background: rgba(255,255,255,0.1); opacity: 1; }

        /* Control Panel */
        .o_control_panel {
            background: white; border-bottom: 1px solid var(--o-v19-border);
            padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
        }
        .o_breadcrumb { font-size: 20px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
        .btn { border-radius: 6px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
        .btn-primary { background: var(--o-v19-purple); color: white; }
        .btn-secondary { background: white; border-color: var(--o-v19-border); color: var(--o-v19-purple); }

        /* Form Sheet */
        .o_content { flex: 1; overflow-y: auto; padding: 20px; }
        .o_form_sheet {
            background: white; border: 1px solid var(--o-v19-border);
            width: 100%; max-width: 1200px; margin: 0 auto; border-radius: 12px;
            padding: 40px; box-shadow: 0 10px 15px rgba(0,0,0,0.05);
        }

        /* Statusbar */
        .o_form_statusbar {
            margin: -40px -40px 30px -40px; padding: 12px 40px;
            border-bottom: 1px solid var(--o-v19-border); display: flex;
            justify-content: space-between; align-items: center; background: #fafafa;
            border-radius: 12px 12px 0 0;
        }
        .o_status_step { padding: 6px 20px; font-size: 12px; font-weight: bold; background: white; color: #9ca3af; border: 1px solid var(--o-v19-border); margin-left: -1px; }
        .o_status_step.active { background: var(--o-v19-purple); color: white; }

        /* Fields Grid */
        .o_inner_group { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-bottom: 30px; }
        .o_cell { display: flex; align-items: center; margin-bottom: 15px; }
        .o_label { width: 150px; font-size: 13px; font-weight: 600; color: #6b7280; }
        .o_input { border: none; border-bottom: 1px solid var(--o-v19-border); flex: 1; padding: 4px 0; outline: none; font-size: 15px; }

        /* Notebook Table */
        .o_list_table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .o_list_table th { text-align: right; padding: 12px; font-size: 13px; border-bottom: 2px solid var(--o-v19-border); }
        .o_list_table td { padding: 10px; border-bottom: 1px solid var(--o-v19-border); }

        /* Totals - Saudi VAT Style */
        .o_group_totals { float: left; width: 350px; margin-top: 30px; background: #f9fafb; padding: 20px; border-radius: 8px; }
        .total_line { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .total_grand { font-size: 20px; font-weight: 800; border-top: 2px solid #cbd5e1; padding-top: 10px; color: var(--o-v19-purple); }
    </style>
</head>
<body>

    <nav class="o_navbar">
        <i class="fas fa-th-large" style="margin-right:10px"></i>
        <div class="o_menu_brand">المحاسبة <span style="font-weight:300; font-size:12px;">المملكة العربية السعودية</span></div>
        <div class="o_nav_link">العملاء</div>
        <div class="o_nav_link">الموردين</div>
        <div class="o_nav_link">الضريبة</div>
    </nav>

    <div class="o_control_panel">
        <div class="o_breadcrumb">
            <span style="color: var(--o-v19-purple)">فواتير العملاء</span>
            <i class="fas fa-chevron-left" style="font-size:12px; color:#ccc"></i>
            <span>جديد</span>
        </div>
        <div class="o_cp_buttons">
            <button class="btn btn-primary" onclick="postEntry()">حفظ وتأكيد</button>
            <button class="btn btn-secondary">طباعة فاتورة ضريبية</button>
        </div>
    </div>

    <div class="o_content">
        <div class="o_form_sheet">
            <div class="o_form_statusbar">
                <button class="btn btn-secondary">إرسال للمراجعة</button>
                <div style="display:flex">
                    <div class="o_status_step active">مسودة</div>
                    <div class="o_status_step">مؤكد</div>
                    <div class="o_status_step">مرحل</div>
                </div>
            </div>

            <h1 style="font-size: 28px; margin-bottom: 30px;">فاتورة ضريبية مبسطة</h1>

            <div class="o_inner_group">
                <div>
                    <div class="o_cell"><span class="o_label">العميل</span><input type="text" class="o_input" placeholder="اختر عميل..."></div>
                    <div class="o_cell"><span class="o_label">الرقم الضريبي</span><input type="text" class="o_input" placeholder="3xxxxxxxxxxxxxx"></div>
                </div>
                <div>
                    <div class="o_cell"><span class="o_label">تاريخ الفاتورة</span><input type="date" class="o_input"></div>
                    <div class="o_cell"><span class="o_label">طريقة الدفع</span><select class="o_input"><option>نقداً</option><option>شبكة</option><option>تحويل بنكي</option></select></div>
                </div>
            </div>

            <table class="o_list_table">
                <thead>
                    <tr>
                        <th>المنتج</th>
                        <th>الكمية</th>
                        <th>السعر</th>
                        <th>الضريبة</th>
                        <th>المجموع (ر.س)</th>
                        <th width="30px"></th>
                    </tr>
                </thead>
                <tbody id="lines"></tbody>
            </table>
            <button style="border:none; background:none; color:var(--o-v19-teal); font-weight:700; cursor:pointer; margin-top:15px;" onclick="addLine()">+ إضافة صنف</button>

            <div class="o_group_totals">
                <div class="total_line"><span>المجموع غير شامل الضريبة</span><span id="subtotal">0.00</span></div>
                <div class="total_line"><span>ضريبة القيمة المضافة (15%)</span><span id="vat">0.00</span></div>
                <div class="total_line total_grand"><span>الإجمالي شامل الضريبة</span><span id="total_all">0.00 ر.س</span></div>
            </div>
            <div style="clear:both"></div>
        </div>
    </div>

    <script>
        function addLine() {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><input type="text" class="o_input" placeholder="وصف المنتج"></td>
                <td><input type="number" class="qty o_input" value="1" onchange="calc()"></td>
                <td><input type="number" class="price o_input" value="0" onchange="calc()"></td>
                <td><select class="tax o_input" onchange="calc()"><option value="0.15">15%</option><option value="0">0%</option></select></td>
                <td class="line_total">0.00</td>
                <td><i class="fas fa-trash" style="color:#ddd; cursor:pointer" onclick="this.parentElement.parentElement.remove();calc();"></i></td>
            `;
            document.getElementById('lines').appendChild(row);
        }

        function calc() {
            let subtotal = 0;
            let totalVat = 0;
            
            document.querySelectorAll('#lines tr').forEach(row => {
                const qty = parseFloat(row.querySelector('.qty').value) || 0;
                const price = parseFloat(row.querySelector('.price').value) || 0;
                const taxRate = parseFloat(row.querySelector('.tax').value) || 0;
                
                const linePrice = qty * price;
                const lineVat = linePrice * taxRate;
                
                row.querySelector('.line_total').innerText = (linePrice + lineVat).toFixed(2);
                
                subtotal += linePrice;
                totalVat += lineVat;
            });

            document.getElementById('subtotal').innerText = subtotal.toFixed(2);
            document.getElementById('vat').innerText = totalVat.toFixed(2);
            document.getElementById('total_all').innerText = (subtotal + totalVat).toFixed(2) + " ر.س";
        }

        function postEntry() {
            alert("تم ترحيل الفاتورة الضريبية طبقاً لمعايير زاتكا (ZATCA)");
        }

        window.onload = addLine;
    </script>
</body>
</html>
