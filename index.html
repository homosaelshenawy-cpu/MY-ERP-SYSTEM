<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Enterprise ERP | Professional View</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --odoo-purple: #714B67; --odoo-teal: #00A09D; --bg-gray: #f0f2f5; --text: #4c4c4c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-gray); margin: 0; display: flex; height: 100vh; color: var(--text); }
        
        /* Sidebar */
        .sidebar { width: 70px; background: #4c4c4c; display: flex; flex-direction: column; align-items: center; padding-top: 20px; transition: 0.3s; }
        .sidebar:hover { width: 200px; }
        .nav-icon { color: white; padding: 15px; cursor: pointer; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; }
        .nav-icon:hover { background: var(--odoo-purple); }
        .nav-icon span { display: none; margin-right: 10px; }
        .sidebar:hover span { display: inline; }

        /* Main View */
        .viewport { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { height: 50px; background: white; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 20px; font-weight: bold; color: var(--odoo-purple); }
        
        /* Kanban Dashboard */
        .kanban-container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .odoo-card { background: white; border-left: 5px solid var(--odoo-purple); border-radius: 3px; box-shadow: 0 2px 5px #ccc; padding: 15px; }
        .card-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        
        /* Accounting Form (Odoo Style) */
        .odoo-form { background: white; margin: 20px; padding: 30px; border-radius: 3px; box-shadow: 0 2px 10px #ddd; flex: 1; overflow-y: auto; }
        .form-header { border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 20px; }
        .odoo-table { width: 100%; border-collapse: collapse; }
        .odoo-table th { background: #f8f9fa; border-bottom: 2px solid #dee2e6; padding: 10px; text-align: right; }
        .odoo-table td { border-bottom: 1px solid #eee; padding: 8px; }
        input[type="text"], input[type="number"], select { border: none; border-bottom: 1px solid #ccc; padding: 5px; width: 100%; outline: none; }
        input:focus { border-bottom: 2px solid var(--odoo-teal); }

        .btn-odoo { background: var(--odoo-teal); color: white; border: none; padding: 8px 15px; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .btn-secondary { background: white; border: 1px solid #ccc; padding: 8px 15px; border-radius: 3px; cursor: pointer; }
        
        .total-box { float: left; width: 250px; margin-top: 20px; background: #f8f9fa; padding: 15px; }
        .total-line { display: flex; justify-content: space-between; margin-bottom: 5px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="nav-icon" onclick="showTab('dash')"><i class="fas fa-th"></i> <span>الرئيسية</span></div>
        <div class="nav-icon" onclick="showTab('accounting')"><i class="fas fa-calculator"></i> <span>المحاسبة</span></div>
        <div class="nav-icon" onclick="showTab('trial')"><i class="fas fa-balance-scale"></i> <span>ميزان المراجعة</span></div>
    </aside>

    <main class="viewport">
        <div class="top-bar" id="page-title">لوحة التحكم المحاسبية</div>

        <section id="tab-dash" class="tab-content">
            <div class="kanban-container">
                <div class="odoo-card">
                    <div class="card-header"><span>عملاء - فواتير</span> <i class="fas fa-ellipsis-v"></i></div>
                    <div style="display:flex; justify-content: space-between;">
                        <button class="btn-odoo">فاتورة جديدة</button>
                        <div style="text-align:left"><small>بانتظار الدفع</small><br><b id="sales-sum">0.00 ج.م</b></div>
                    </div>
                </div>
                <div class="odoo-card" style="border-left-color: var(--odoo-teal);">
                    <div class="card-header"><span>البنك / الخزينة</span> <i class="fas fa-ellipsis-v"></i></div>
                    <div style="display:flex; justify-content: space-between;">
                        <button class="btn-secondary">مطابقة</button>
                        <div style="text-align:left"><small>الرصيد في أودو</small><br><b id="bank-sum">100,000.00 ج.م</b></div>
                    </div>
                </div>
            </div>
        </section>

        <section id="tab-accounting" class="tab-content" style="display:none;">
            <div class="odoo-form">
                <div class="form-header">
                    <button class="btn-odoo" onclick="saveEntry()">حفظ وتأكيد</button>
                    <button class="btn-secondary" onclick="addLine()">إضافة سطر (Add a line)</button>
                    <h2 style="margin-top:20px">قيد يومية جديد</h2>
                    <div style="display:flex; gap:20px">
                        <div>التاريخ: <input type="date" id="entry-date"></div>
                        <div>المرجع: <input type="text" id="entry-ref" placeholder="مثلاً: INV/2024/001"></div>
                    </div>
                </div>

                <table class="odoo-table">
                    <thead>
                        <tr>
                            <th width="40%">الحساب</th>
                            <th>البيان</th>
                            <th>مدين</th>
                            <th>دائن</th>
                            <th width="5%"></th>
                        </tr>
                    </thead>
                    <tbody id="entry-lines">
                        </tbody>
                </table>

                <div class="total-box">
                    <div class="total-line"><span>إجمالي المدين:</span> <span id="total-debit">0.00</span></div>
                    <div class="total-line"><span>إجمالي الدائن:</span> <span id="total-credit">0.00</span></div>
                    <div class="total-line" style="border-top:1px solid #ccc; font-weight:bold"><span>الفرق:</span> <span id="total-diff">0.00</span></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const state = {
            coa: {
                "101": "نقدية", "102": "البنك", "201": "موردين", "401": "مبيعات", "501": "مصروفات"
            },
            journalEntries: []
        };

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.getElementById('tab-' + id).style.display = 'block';
            document.getElementById('page-title').innerText = (id === 'dash' ? 'لوحة التحكم' : 'دفتر القيود');
        }

        function addLine() {
            const tbody = document.getElementById('entry-lines');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><select class="line-acc">${Object.entries(state.coa).map(([code, name]) => `<option value="${code}">${code} ${name}</option>`).join('')}</select></td>
                <td><input type="text" class="line-desc"></td>
                <td><input type="number" class="line-debit" value="0" onchange="calcTotals()"></td>
                <td><input type="number" class="line-credit" value="0" onchange="calcTotals()"></td>
                <td><i class="fas fa-trash" style="color:#ccc; cursor:pointer" onclick="this.parentElement.parentElement.remove(); calcTotals();"></i></td>
            `;
            tbody.appendChild(row);
        }

        function calcTotals() {
            let d = 0, c = 0;
            document.querySelectorAll('.line-debit').forEach(i => d += parseFloat(i.value || 0));
            document.querySelectorAll('.line-credit').forEach(i => c += parseFloat(i.value || 0));
            document.getElementById('total-debit').innerText = d.toFixed(2);
            document.getElementById('total-credit').innerText = c.toFixed(2);
            document.getElementById('total-diff').innerText = (d - c).toFixed(2);
        }

        function saveEntry() {
            const diff = parseFloat(document.getElementById('total-diff').innerText);
            if (diff !== 0) {
                alert("عفواً! القيد غير متوازن. يجب أن يتساوى المدين والدائن (نظام أودو)");
                return;
            }
            alert("تم تأكيد القيد وترحيله بنجاح!");
            // هنا بنضيف الكود بتاع الترحيل الفعلي للـ Database
        }

        // البداية بـ سطرين فاضيين زي أودو
        window.onload = () => { addLine(); addLine(); };
    </script>
</body>
</html>
