<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام ERP - اللوحة الرئيسية</title>
    <style>
        :root { --primary-color: #2c3e50; --accent-color: #3498db; --bg-color: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); margin: 0; display: flex; }
        .sidebar { width: 250px; background-color: var(--primary-color); height: 100vh; color: white; padding: 20px; position: fixed; }
        .sidebar h2 { text-align: center; border-bottom: 1px solid #555; padding-bottom: 20px; }
        .sidebar nav a { display: block; color: white; text-decoration: none; padding: 15px 10px; border-radius: 5px; transition: 0.3s; }
        .sidebar nav a:hover { background-color: var(--accent-color); }
        .main-content { margin-right: 250px; padding: 30px; width: 100%; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .btn { background-color: var(--accent-color); color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>نظام أودو العربي</h2>
        <nav>
            <a href="index.html">🏠 لوحة التحكم</a>
            <a href="accounting.html">💰 المحاسبة</a>
            <a href="#">📦 المخازن</a>
            <a href="#">👥 العملاء</a>
        </nav>
    </div>
    <div class="main-content">
        <header>
            <h1>مرحباً بك في لوحة التحكم</h1>
            <a href="accounting.html" class="btn">+ إضافة عملية جديدة</a>
        </header>
        <div class="stats-container">
            <div class="card"><h3>رصيد البنك</h3><p>100,000 ج.م</p></div>
            <div class="card"><h3>إجمالي المبيعات</h3><p>45,500 ج.م</p></div>
            <div class="card"><h3>صافي الربح</h3><p style="color: green;">33,300 ج.م</p></div>
        </div>
    </div>
</body>
</html>
