<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Odoo Enterprise - Accounting</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --odoo-primary: #714B67;
            --odoo-secondary: #00A09D;
            --odoo-bg: #f1f2f7;
            --odoo-text: #4c4c4c;
            --odoo-border: #dee2e6;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--odoo-bg); color: var(--odoo-text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Odoo Top Bar */
        .o_main_navbar { background: var(--odoo-primary); color: white; height: 46px; display: flex; align-items: center; padding: 0 15px; font-size: 14px; flex-shrink: 0; }
        .o_menu_brand { font-weight: bold; margin-left: 20px; cursor: pointer; }
        .o_nav_link { padding: 0 10px; cursor: pointer; height: 100%; display: flex; align-items: center; transition: 0.2s; }
        .o_nav_link:hover { background: rgba(255,255,255,0.1); }

        /* Control Panel (Breadcrumbs & Actions) */
        .o_control_panel { background: white; border-bottom: 1px solid var(--odoo-border); padding: 10px 25px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .o_breadcrumb { font-size: 18px; display: flex; gap: 10px; align-items: center; }
        .o_cp_buttons .btn { border-radius: 4px; padding: 6px 12px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .btn_primary { background: var(--odoo-primary); color: white; }
        .btn_secondary { background: white; border-color: var(--odoo-border); color: var(--odoo-primary); }

        /* Content Area */
        .o_content { flex: 1; overflow-y: auto; padding: 16px; position: relative; }

        /* Kanban Dashboard (Odoo Accounting Style) */
        .o_kanban_view { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
        .o_kanban_record { background: white; border: 1px solid var(--odoo-border); border-left: 5px solid var(--odoo-primary); padding: 16px; }
        .o_kanban_header { display: flex; justify-content: space-between; font-weight: bold; color: var(--odoo-primary); margin-bottom: 15px; }
        
        /* Journal Entry View (The Core) */
        .o_form_view { background: white; min-height: 100%; border: 1px solid var(--odoo-border); padding: 32px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .o_group { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 30px; }
        .o_field { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding: 5px 0; }
        .o_label { width: 120px; font-weight: bold; color: #666; font-size: 13px; }
        .o_input { border: none; outline: none; flex: 1; font-size: 14px; }

        /* Notebook (Lines) */
        .o_notebook { margin-top: 30px; }
        .o_list_table { width: 100%; border-collapse: collapse; }
        .o_list_table th { background: #f8f9fa; border-bottom: 2px solid var(--odoo-border); padding: 10px; text-align: right; font-size: 13px; }
        .o_list_table td { border-bottom: 1px solid var(--odoo-border); padding: 8px; }
        .o_list_table input { border: none; width: 100%; outline: none; background: transparent; }
        
        /* Totals */
        .o_group_totals { float: left; width: 300px; margin-top: 20px; }
        .o_total_row { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <nav class="o_main_navbar">
        <div class="o_menu_brand" onclick="navigate('dash')">المحاسبة</div>
        <div class="o_nav_link" onclick="navigate('dash')">الداشبورد</div>
        <div class="o_nav_link" onclick="navigate('journal')">قيود اليومية</div>
        <div class="o_nav_link" onclick="alert('قريباً: ميزان المراجعة')">التقارير</div>
    </nav>

    <div class="o_control_panel">
        <div class="o_breadcrumb">
            <span style="color: var(--odoo-primary); cursor:pointer" onclick="navigate('dash')">المحاسبة</span>
            <span style="color: #ccc;">/</span>
            <span id="cp_title">لوحة التحكم</span>
        </div>
        <div class="o_cp_buttons" id="cp_actions">
            <button class="btn btn_primary" onclick="navigate('journal')">إنشاء</button>
            <button class="btn btn_secondary">استيراد</button>
        </div>
    </div>

    <div class="o_content">
        <div id="view_dash" class="o_view">
            <div class="o_kanban_view">
                <div class="o_kanban_record">
                    <div class="o_kanban_header"><span>فواتير العملاء</span> <i class="fas fa-ellipsis-v"></i></div>
                    <div style="display:flex; justify-content:space-between">
                        <button class="btn btn_primary" onclick="navigate('journal')">فاتورة جديدة</button>
                        <div style="text-align:left">
                            <span style="color:var(--odoo-secondary); font-weight:bold">0.00 ج.م</span><br>
                            <small>بانتظار الدفع</small>
                        </div>
                    </div>
                </div>
                <div class="o_kanban_record" style="border-left-color: var(--odoo-secondary)">
                    <div class="o_kanban_header"><span>البنك</span> <i class="fas fa-ellipsis-v"></i></div>
                    <div style="display:flex; justify-content:space-between">
                        <button class="btn btn_secondary">مطابقة</button>
                        <div style="text-align:left">
                            <span style="font-weight:bold">100,000.00 ج.م</span><br>
                            <small>الرصيد في أودو</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="view_journal" class="o_view" style="display:none;">
            <div class="o_form_view">
                <div class="o_group">
                    <div>
                        <div class="o_field"><span class="o_label">المرجع</span><input type="text" class="o_input" placeholder="MISC/2024/0001"></div>
                        <div class="o_field"><span class="o_label">اليومية</span><select class="o_input"><option>عمليات متفرقة</option><option>البنك</option></select></div>
                    </div>
                    <div>
                        <div class="o_field"><span class="o_label">التاريخ</span><input type="date" class="o_input"></div>
                        <div class="o_field"><span class="o_label">الشركة</span><input type="text" class="o_input" value="شركتي العربية" readonly></div>
                    </div>
                </div>

                <div class="o_notebook">
                    <table class="o_list_table">
                        <thead>
                            <tr>
                                <th>الحساب</th>
                                <th>الشريك (Partner)</th>
                                <th>التسمية (Label)</th>
                                <th>مدين</th>
                                <th>دائن</th>
                            </tr>
                        </thead>
                        <tbody id="journal_lines">
                            </tbody>
                    </table>
                    <button class="btn btn_secondary" style="margin-top:10px; border:none; color:var(--odoo-secondary)" onclick="addLine()">إضافة سطر</button>
                </div>

                <div class="o_group_totals">
                    <div class="o_total_row"><span>إجمالي المدين</span><span id="t_debit">0.00</span></div>
                    <div class="o_total_row"><span>إجمالي الدائن</span><span id="t_credit">0.00</span></div>
                    <div class="o_total_row" style="font-weight:bold; font-size:16px"><span>المجموع</span><span id="t_final">0.00</span></div>
                </div>
                <div style="clear:both"></div>
            </div>
        </div>
    </div>

    <script>
        // دالة التنقل بين الموديولات (أودو ستايل)
        function navigate(viewId) {
            document.querySelectorAll('.o_view').forEach(v => v.style.display = 'none');
            document.getElementById('view_' + viewId).style.display = 'block';
            
            const title = document.getElementById('cp_title');
            const actions = document.getElementById('cp_actions');
            
            if(viewId === 'dash') {
                title.innerText = "لوحة التحكم";
                actions.innerHTML = `<button class="btn btn_primary" onclick="navigate('journal')">إنشاء</button>`;
            } else {
                title.innerText = "قيود اليومية / جديد";
                actions.innerHTML = `<button class="btn btn_primary" onclick="saveEntry()">حفظ وتأكيد</button>
                                     <button class="btn btn_secondary" onclick="navigate('dash')">إلغاء</button>`;
            }
        }

        function addLine() {
            const tbody = document.getElementById('journal_lines');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><input type="text" placeholder="اختر الحساب..." list="coa"></td>
                <td><input type="text" placeholder="العميل/المورد"></td>
                <td><input type="text"></td>
                <td><input type="number" class="d_val" value="0" onchange="calc()"></td>
                <td><input type="number" class="c_val" value="0" onchange="calc()"></td>
            `;
            tbody.appendChild(row);
        }

        function calc() {
            let d = 0, c = 0;
            document.querySelectorAll('.d_val').forEach(i => d += parseFloat(i.value || 0));
            document.querySelectorAll('.c_val').forEach(i => c += parseFloat(i.value || 0));
            document.getElementById('t_debit').innerText = d.toFixed(2);
            document.getElementById('t_credit').innerText = c.toFixed(2);
            document.getElementById('t_final').innerText = d.toFixed(2);
        }

        function saveEntry() {
            const d = document.getElementById('t_debit').innerText;
            const c = document.getElementById('t_credit').innerText;
            if(d !== c || d === "0.00") {
                alert("القيد غير متوازن! أودو يتطلب تساوي المدين والدائن.");
            } else {
                alert("تم الترحيل (Posted) بنجاح!");
                navigate('dash');
            }
        }

        window.onload = () => { addLine(); addLine(); };
    </script>

    <datalist id="coa">
        <option value="101000 البنك"></option>
        <option value="102000 الصندوق"></option>
        <option value="400000 المبيعات"></option>
        <option value="200000 الموردين"></option>
    </datalist>
</body>
</html>
